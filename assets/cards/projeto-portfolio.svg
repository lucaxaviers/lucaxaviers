<svg xmlns="http://www.w3.org/2000/svg" width="520" height="160" viewBox="0 0 520 160" fill="none">
  <defs>
    <linearGradient id="pBg_portfolio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="520" height="160" rx="20" fill="url(#pBg_portfolio)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Title and Description (Larger typography, no tech labels) -->
  <g transform="translate(28, 0)">
    <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Portfólio Pessoal</text>
    <text x="0" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8">Extensão web do perfil GitHub e projetos em produção</text>
  </g>

  <!-- Action Button (Positioned cleanly at bottom right) -->
  <g transform="translate(312, 102)">
    <rect width="180" height="38" rx="19" fill="#0071e3" stroke="#0071e3" stroke-width="1"/>
    <text x="90" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Acessar Portfólio ↗</text>
  </g>
</svg>