<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="Lucas Xavier - Engenharia de Software">
  <defs>
    <!-- Background Gradient (Midnight Navy / Carbon) -->
    <linearGradient id="headerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0e1526"/>
    </linearGradient>

    <!-- Subtle Radial Glow in Apple Blue -->
    <radialGradient id="ambientGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0071e3" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="headerGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>

    <!-- Clip Path for Rounded Canvas -->
    <clipPath id="headerClip">
      <rect width="1200" height="290" rx="28"/>
    </clipPath>

    <style>
      .eyebrow {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 3px;
        fill: #86868b;
        text-transform: uppercase;
      }
      .name-white {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif;
        font-weight: 900;
        font-size: 70px;
        letter-spacing: -2px;
        fill: #ffffff;
      }
      .name-blue {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif;
        font-weight: 900;
        font-size: 70px;
        letter-spacing: -2px;
        fill: #0071e3;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif;
        font-weight: 600;
        font-size: 13.5px;
      }
      .spec-label {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, monospace;
        font-size: 12px;
        fill: #86868b;
      }
      .spec-value {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, monospace;
        font-size: 12px;
        font-weight: 600;
        fill: #e5e5ea;
      }
        50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 6px #10b981); }
      }
    </style>
  </defs>

  <g clip-path="url(#headerClip)">
    <!-- Base Background -->
    <rect width="1200" height="290" fill="url(#headerBg)"/>
    <rect width="1200" height="290" fill="url(#headerGrid)"/>
    <rect width="1200" height="290" fill="url(#ambientGlow)"/>

    <!-- ==================== LEFT: TYPOGRAPHY & IDENTITY ==================== -->
    <g transform="translate(80, 0)">
      <!-- Eyebrow -->
      <text class="eyebrow" x="0" y="78">ENGENHARIA DE SOFTWARE</text>

      <!-- Main Headline -->
      <text x="0" y="156">
        <tspan class="name-white">Lucas </tspan>
        <tspan class="name-blue">Xavier.</tspan>
      </text>

      <!-- Status & Location Pills -->
      <g transform="translate(0, 192)">
        <!-- Pill 1: Aberto a estágio (sem bolinha verde piscante) -->
        <rect x="0" y="0" width="156" height="40" rx="20" fill="#121724" stroke="#222d42" stroke-width="1.2"/>
        <text class="pill-text" x="78" y="25" text-anchor="middle" fill="#f1f5f9">Aberto a estágio</text>

        <!-- Pill 2: Paulínia, SP -->
        <rect x="168" y="0" width="138" height="40" rx="20" fill="#121724" stroke="#222d42" stroke-width="1.2"/>
        <text class="pill-text" x="237" y="25" text-anchor="middle" fill="#94a3b8">Paulínia, SP</text>

        <!-- Pill 3: Full-Stack & Mobile -->
        <rect x="318" y="0" width="182" height="40" rx="20" fill="#121724" stroke="#222d42" stroke-width="1.2"/>
        <text class="pill-text" x="409" y="25" text-anchor="middle" fill="#94a3b8">Full-Stack &amp; Mobile</text>
      </g>
    </g>

    <!-- ==================== RIGHT: SLEEK SYSTEM TERMINAL CARD (CLEAN & INTEGRATED) ==================== -->
    <g transform="translate(735, 52)">
      <!-- Panel Container (Fixed, sleek, non-floating) -->
      <rect width="385" height="186" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>
      
      <!-- Panel Header Bar -->
      <rect width="385" height="38" rx="20" fill="#0f172a" fill-opacity="0.8"/>
      <rect y="20" width="385" height="18" fill="#0f172a" fill-opacity="0.8"/>
      <line x1="0" y1="38" x2="385" y2="38" stroke="#1e293b" stroke-width="1"/>

      <!-- Window Dots -->
      <circle cx="24" cy="19" r="4.5" fill="#ef4444" fill-opacity="0.8"/>
      <circle cx="39" cy="19" r="4.5" fill="#f59e0b" fill-opacity="0.8"/>
      <circle cx="54" cy="19" r="4.5" fill="#10b981" fill-opacity="0.8"/>

      <!-- Terminal Title -->
      <text font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11.5" font-weight="600" fill="#64748b" x="192" y="23" text-anchor="middle">lucaxaviers.config</text>

      <!-- Terminal Body Rows -->
      <g transform="translate(24, 62)">
        <!-- Row 1: status -->
        <text class="spec-label" x="0" y="0">status</text>
        <text class="spec-value" x="95" y="0" fill="#10b981">ready_to_build</text>

        <!-- Row 2: core_stack -->
        <text class="spec-label" x="0" y="26">core_stack</text>
        <text class="spec-value" x="95" y="26">TypeScript, Next.js, Flutter</text>

        <!-- Row 3: graduacao -->
        <text class="spec-label" x="0" y="52">graduacao</text>
        <text class="spec-value" x="95" y="52" fill="#0071e3">Cursando Engenharia de Software</text>

        <!-- Row 4: formacao tecnica -->
        <text class="spec-label" x="0" y="78">formacao</text>
        <text class="spec-value" x="95" y="78">Téc. em Informática (Bento Quirino)</text>
      </g>

      <!-- Subtle Accent Indicator on Bottom Right -->
      <rect x="325" y="146" width="36" height="4" rx="2" fill="#0071e3" fill-opacity="0.6"/>
    </g>

    <!-- Outer Canvas Glass Border -->
    <rect x="1" y="1" width="1198" height="288" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  </g>
</svg>
